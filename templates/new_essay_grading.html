<div class="max-w-4xl mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-slate-900">Grading Rubric</h2>
            <a href="/essay_rubric" class="text-sm text-blue-600 hover:text-blue-700 font-medium">Edit Full Rubric</a>
        </div>

        <form action="/essay_grading" method="POST" class="flex gap-3">
            <input type="text" name="essay_rubric" placeholder="Enter custom rubric criteria..."
                value="{{ rubric_text or '' }}"
                class="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">

            <button type="submit" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-900 transition-colors">
                Set Rubric
            </button>
        </form>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="border-b border-slate-200">
            <div class="flex">
                <button onclick="switchTab('text')" id="tab-text"
                    class="flex-1 py-4 text-sm font-medium text-blue-600 border-b-2 border-blue-600 bg-blue-50/50">
                    Text Input
                </button>

                <button onclick="switchTab('pdf')" id="tab-pdf"
                    class="flex-1 py-4 text-sm font-medium text-slate-500 hover:text-slate-700">
                    PDF Upload
                </button>
            </div>
        </div>

        <div class="p-6">
            <form id="form-text" action="/essay_grading" method="POST" class="space-y-4">
                <textarea name="essay_text" rows="12" placeholder="Paste your essay here..."
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none">{{ input_text or '' }}</textarea>

                <input type="hidden" name="rubric_text" value="{{ rubric_text or '' }}">

                <button type="submit"
                    class="w-full bg-emerald-600 text-white font-medium py-3 rounded-xl hover:bg-emerald-700 transition-colors">
                    Grade Essay
                </button>
            </form>

            <form id="form-pdf" action="/essay_grading" method="POST"
                enctype="multipart/form-data" class="space-y-4 hidden">

                <div class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center">
                    <input type="file" name="file" accept=".pdf" required
                        class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">

                    <p class="text-xs text-slate-500 mt-2">PDF files only</p>
                </div>

                <input type="hidden" name="rubric_text" value="{{ rubric_text or '' }}">

                <button type="submit"
                    class="w-full bg-emerald-600 text-white font-medium py-3 rounded-xl hover:bg-emerald-700 transition-colors">
                    Grade PDF Essay
                </button>
            </form>
        </div>
    </div>

    {% if result %}
        <div class="mt-6 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="flex items-center gap-2 mb-4">
                <div class="w-8 h-8 bg-emerald-100 rounded-lg flex items-center justify-center">
                    <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z">
                        </path>
                    </svg>
                </div>

                <h2 class="text-lg font-semibold text-slate-900">
                    Evaluation Result
                </h2>
            </div>

            <div id="evaluation-result"
                class="prose prose-slate max-w-none text-sm text-slate-700 leading-relaxed">
            </div>

            <script>
                const markdownResult = `{{ result | safe }}`;

                document.getElementById("evaluation-result").innerHTML =
                    marked.parse(markdownResult);
            </script>
        </div>
    {% endif %}
</div>

<script>
    function switchTab(tab) {
        const textForm = document.getElementById('form-text');
        const pdfForm = document.getElementById('form-pdf');
        const tabText = document.getElementById('tab-text');
        const tabPdf = document.getElementById('tab-pdf');

        if (tab === 'text') {
            textForm.classList.remove('hidden');
            pdfForm.classList.add('hidden');

            tabText.className =
                'flex-1 py-4 text-sm font-medium text-blue-600 border-b-2 border-blue-600 bg-blue-50/50';

            tabPdf.className =
                'flex-1 py-4 text-sm font-medium text-slate-500 hover:text-slate-700';
        } else {
            textForm.classList.add('hidden');
            pdfForm.classList.remove('hidden');

            tabText.className =
                'flex-1 py-4 text-sm font-medium text-slate-500 hover:text-slate-700';

            tabPdf.className =
                'flex-1 py-4 text-sm font-medium text-blue-600 border-b-2 border-blue-600 bg-blue-50/50';
        }
    }
</script>
